services:
  db:
    image: postgis/postgis:16-3.4
    container_name: resqio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: resqio_user
      POSTGRES_PASSWORD: resqio_password
    ports:
      - "5433:5432"
    volumes:
      - resqio-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqio_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resqio-postgis-data:
